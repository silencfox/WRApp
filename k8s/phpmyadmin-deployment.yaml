apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  namespace: wr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      nodeSelector:
        kubernetes.io/hostname: rasppi516   # ⬅️ Mismo nodo
      containers:
        - name: phpmyadmin
          image: phpmyadmin:latest
          env:
            - name: PMA_HOST
              value: mysql.wr.svc.cluster.local
            - name: PMA_USER
              value: appuser
            - name: PMA_PASSWORD
              value: apppass
            - name: UPLOAD_LIMIT
              value: "128M"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin
  namespace: wr
spec:
  type: NodePort
  selector:
    app: phpmyadmin
  externalIPs:
    - 10.0.0.16
    - 10.0.0.20
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
